[package]
name = "bdaycli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "chrono"] }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
dotenv = "0.15"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }
